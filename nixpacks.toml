# Fallback if Railway is not using the Dockerfile.
[phases.setup]
nixPkgs = ["python312", "gcc"]

[phases.install]
cmds = [
  "pip install --index-url https://download.pytorch.org/whl/cpu torch",
  "pip install -r requirements.txt"
]

[start]
cmd = "uvicorn api.main:app --host 0.0.0.0 --port ${PORT:-8000} --timeout-keep-alive 75 --proxy-headers --forwarded-allow-ips='*'"
